name: Exact period laboratory
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all exact tests
        run: python -m unittest discover -s tests -v
      - name: Replay independent bounded terminal census
        run: python verify_census.py --max-sum 45 --prefix 2 --expect-well-formed 513020 --expect-terminal 425291 --expect-collisions 0 > /tmp/terminal-census.json
      - name: Smoke test CLI
        run: |
          python -m periodlab analyze --weights 1,1,1,2 --count 4
          python -m periodlab reconstruct --total-weight 3 --coefficients 1,6,90
          python -m periodlab search --max-sum 12 --prefix 2
          python -m periodlab certificate --left 1,1,1,1,1,5,5,24 --right 2,2,2,2,3,3,25 --matching 2 > /tmp/fingerprint-receipt.json
          python -m periodlab verify /tmp/fingerprint-receipt.json

  terminal-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent C++ enumerator
        run: g++ -O3 -std=c++20 -Wall -Wextra -o /tmp/terminal_scan scripts/terminal_collision_scan.cpp
      - name: Replay all well-formed terminal spaces through total weight 51
        run: |
          /tmp/terminal_scan 2 51 2 | tee /tmp/terminal51.log
          grep -q '^L=51 partitions=239943 wellformed=230292 terminal=211234 collisions=77 different_dimension=77' /tmp/terminal51.log
          grep -q '^TOTAL partitions=1535912 wellformed=1477366 terminal=1276492 collisions=77 different_dimension=77' /tmp/terminal51.log
      - name: Independent Python classification at total weight 51
        run: |
          python scripts/first_terminal_collision.py --min-sum 51 --max-sum 51 --assert-first 51 > /tmp/terminal51-python.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/terminal51-python.json"))
          a=report["rows"][0]
          assert a["collision_pairs"]==77
          assert a["all_pairs_are_common_partition_of_12"] is True
          assert a["terminal"]==211234
          PY
