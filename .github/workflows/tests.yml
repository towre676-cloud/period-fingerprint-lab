name: Exact period laboratory
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run all exact tests
        run: python -m unittest discover -s tests -v
      - name: Replay independent bounded terminal census
        run: python verify_census.py --max-sum 45 --prefix 2 --expect-well-formed 513020 --expect-terminal 425291 --expect-collisions 0 > /tmp/terminal-census.json
      - name: Smoke test CLI
        run: |
          python -m periodlab analyze --weights 1,1,1,2 --count 4
          python -m periodlab reconstruct --total-weight 3 --coefficients 1,6,90
          python -m periodlab search --max-sum 12 --prefix 2
          python -m periodlab certificate --left 1,1,1,1,1,5,5,24 --right 2,2,2,2,3,3,25 --matching 2 > /tmp/fingerprint-receipt.json
          python -m periodlab verify /tmp/fingerprint-receipt.json

  terminal-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent C++ enumerator
        run: g++ -O3 -std=c++20 -Wall -Wextra -o /tmp/terminal_scan scripts/terminal_collision_scan.cpp
      - name: Replay all well-formed terminal spaces through total weight 51
        run: |
          /tmp/terminal_scan 2 51 2 | tee /tmp/terminal51.log
          grep -q '^L=51 partitions=239943 wellformed=230292 terminal=211234 collisions=77 different_dimension=77' /tmp/terminal51.log
          grep -q '^TOTAL partitions=1535912 wellformed=1477366 terminal=1276492 collisions=77 different_dimension=77' /tmp/terminal51.log
      - name: Independent Python classification at total weight 51
        run: |
          python scripts/first_terminal_collision.py --min-sum 51 --max-sum 51 --assert-first 51 > /tmp/terminal51-python.json
          python - <<'PY'
          import json
          report=json.load(open("/tmp/terminal51-python.json"))
          a=report["rows"][0]
          assert a["collision_pairs"]==77
          assert a["all_pairs_are_common_partition_of_12"] is True
          assert a["terminal"]==211234
          PY

  three-prefix-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact prime-valuation enumerator
        run: g++ -O3 -std=c++20 -Wall -Wextra -o /tmp/terminal_scan scripts/terminal_collision_scan.cpp
      - name: Exhaust terminal three-prefix comparisons through weight 70
        run: |
          /tmp/terminal_scan 2 70 3 > /tmp/three-prefix-L70.log
          cat /tmp/three-prefix-L70.log | tail -25
          ! grep -Eq '^L=[0-9]+.*collisions=[1-9]' /tmp/three-prefix-L70.log
          grep -Eq '^TOTAL .*collisions=0 different_dimension=0$' /tmp/three-prefix-L70.log

  exact-lattice-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recompute signed three-prefix relations and sharp weight thresholds
        run: python scripts/verify_k3_relations.py research/k3_exact_relations.json
      - name: Independently certify four-prefix uniqueness over F2 through max weight 1500
        run: python scripts/verify_k4_bound.py --max-weight 1500 --prefix 4
      - name: Compile corrected-width modular rank checker
        run: g++ -O3 -std=c++20 -Wall -Wextra -o /tmp/weight_rank scripts/verify_k4_rank.cpp
      - name: Prove four-prefix rational independence through max weight 1691
        run: |
          /tmp/weight_rank 1691 4
          /tmp/weight_rank 1692 4

  four-prefix-exact-collision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile modular rational-kernel extractor
        run: g++ -std=c++20 -O3 -Wall -Wextra -o /tmp/extract_k4_mod scripts/extract_k4_mod.cpp
      - name: Obtain fifteen independent prime-field residues
        run: |
          mkdir -p /tmp/k4
          for p in 1000000007 1000000009 1000000021 1000000033 1000000087 1000000093 1000000097 1000000103 1000000123 1000000181 1000000207 1000000223 1000000241 1000000271 1000000289; do
            /tmp/extract_k4_mod "$p" > "/tmp/k4/residue_${p}.txt"
          done
      - name: CRT reconstruction and exact factorial-prime verification
        run: |
          python scripts/reconstruct_k4.py /tmp/k4
          python - <<'PY'
          import json
          x=json.load(open('/tmp/k4/k4_exact_relation.json'))
          assert x['max_weight']==1692
          assert len(x['relation'])==587
          assert x['fifth_mismatch_prime_count']==318
          assert x['terminal_total_weight']==9161682624469356243039134091379944313467
          assert x['terminal_dimensions']==[27990950556264851229047371917314029891,27991392711556946301081239744549084077]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: certified-k4-collision
          path: /tmp/k4/k4_exact_relation.json
          retention-days: 90
